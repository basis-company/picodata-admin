name: Docker Publish

on:
  release:
    types: [published]
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Compute tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tags=ghcr.io/basis-company/picodata-admin:latest,ghcr.io/basis-company/picodata-admin:${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tags=ghcr.io/basis-company/picodata-admin:edge" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CI_COMMIT_TAG=${{ github.event_name == 'release' && github.ref_name || github.ref_name }}
            CI_COMMIT_REF_NAME=${{ github.event_name == 'release' && github.event.release.target_commitish || github.ref_name }}
            CI_COMMIT_SHA=${{ github.sha }}
            CI_COMMIT_SHORT_SHA=${{ steps.vars.outputs.sha_short }}
